[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "advanced-rag"
version = "1.0.0"
description = "Advanced RAG Engine"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "faiss-cpu==1.12.0",
    "numpy==2.3.2",
    "requests==2.32.5",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "pypdf==6.0.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["advanced_rag_bundle*"]